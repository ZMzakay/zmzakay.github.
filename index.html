<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zmzakay | Profile</title>
    <style>
        :root {
            --cardboard-bg: url('cardboard-texture.avif');
            --box-border: #5c3a21;
            --box-bg: #f4e8d1;
            --text-color: #2b1d0c;
            --accent-color: #8c5830;
            --stamp-color: #b85d4f;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #bd9569; 
            min-height: 100%;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: var(--cardboard-bg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 0;
        }

        body {
            padding: 16px 10px 30px 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Box / Card Styling */
        .box {
            background-color: var(--box-bg);
            border: 2px solid var(--box-border);
            border-radius: 6px;
            padding: 14px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.08);
            position: relative;
        }

        /* Profile Top Layout */
        .profile-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .profile-left-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .avatar {
            width: 58px;
            height: 58px;
            border-radius: 6px;
            border: 2px solid var(--box-border);
            object-fit: cover;
        }

        .profile-info h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            font-weight: 900;
            line-height: 1.1;
        }

        .profile-info p {
            margin: 3px 0 0;
            font-size: 0.85rem;
            opacity: 0.85;
            font-weight: 500;
        }

        /* Authentic Reference Stamp Box */
        .watermark-stamp {
            border: 1.5px solid var(--stamp-color);
            color: var(--stamp-color);
            font-size: 0.55rem;
            font-weight: 800;
            padding: 3px 6px;
            transform: rotate(3deg);
            text-transform: uppercase;
            border-radius: 2px;
            letter-spacing: 0.5px;
            white-space: nowrap;
            background-color: rgba(255, 255, 255, 0.4);
        }

        .divider {
            border: none;
            border-top: 1.5px dashed var(--box-border);
            margin: 12px 0;
            opacity: 0.6;
        }

        /* Section Titles matching reference style */
        .section-header {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Link Buttons */
        .link-btn {
            background-color: #fff;
            border: 1.5px solid var(--box-border);
            padding: 9px 12px;
            border-radius: 5px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
        }

        .link-btn:hover {
            background-color: #eae0cc;
        }

        .arrow-box {
            font-size: 0.75rem;
            background: var(--box-border);
            color: #fff;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* Project Cards */
        .project-card {
            background-color: #fff;
            border: 1.5px solid var(--box-border);
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-color);
        }

        .project-card:last-child {
            margin-bottom: 0;
        }

        .project-card:hover {
            background-color: #faf5ed;
        }

        .project-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .project-icon {
            width: 38px;
            height: 38px;
            border-radius: 5px;
            border: 1px solid var(--box-border);
            object-fit: cover;
            flex-shrink: 0;
        }

        .project-details h3 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .project-details p {
            margin: 2px 0 0;
            font-size: 0.75rem;
            opacity: 0.7;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Latest Project Highlight Box */
        .latest-box {
            background-color: #faeed4;
            border: 2px solid #b85d4f;
        }

        /* Footer credits / copyright */
        .footer-credits {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-color);
            opacity: 0.7;
            margin-top: 8px;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <div class="container">
        
        <!-- Top Box: Profile & GitHub Link -->
        <div class="box">
            <div class="profile-top">
                <div class="profile-left-group">
                    <img src="IMG_1379.jpeg" alt="Profile" class="avatar" id="profile-avatar">
                    <div class="profile-info">
                        <h1 id="profile-name">zmzakay</h1>
                        <p id="profile-handle">@zmzakay</p>
                    </div>
                </div>
                <div class="watermark-stamp">100% GITHUB MADE</div>
            </div>

            <hr class="divider">

            <!-- GitHub Profile Link Button -->
            <a href="https://github.com/zmzakay" target="_blank" class="link-btn">
                <span>GitHub Profile</span>
                <span class="arrow-box">↗</span>
            </a>
        </div>

        <!-- Latest Project Box -->
        <div class="box latest-box">
            <div class="section-header">
                <span>Latest Project</span>
                <span>🔥</span>
            </div>
            <div id="latest-project-content">
                <p style="font-size: 0.8rem; text-align: center; margin: 5px 0; opacity: 0.7;">Loading latest project...</p>
            </div>
        </div>

        <!-- All Projects Box (Fetched from GitHub) -->
        <div class="box">
            <div class="section-header">
                <span>GitHub Projects</span>
                <span id="repo-count" style="font-size: 0.75rem;">0</span>
            </div>
            <div id="projects-list">
                <p style="font-size: 0.8rem; text-align: center; margin: 5px 0; opacity: 0.7;">Loading repositories...</p>
            </div>
        </div>

        <!-- Footer Credits & Copyright -->
        <div class="footer-credits">
            Inspired by nxtcoreee3 style.<br>
            &copy; 2026 zmzakay. All rights reserved.
        </div>

    </div>

    <script>
        const username = "zmzakay";
        
        async function fetchGitHubData() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated`);
                if (!response.ok) throw new Error("Failed to fetch GitHub repositories");
                
                const repos = await response.json();
                
                document.getElementById('profile-handle').textContent = `@${username}`;
                document.getElementById('repo-count').textContent = repos.length;

                const projectsListEl = document.getElementById('projects-list');
                const latestContentEl = document.getElementById('latest-project-content');
                
                projectsListEl.innerHTML = "";

                if (repos.length === 0) {
                    projectsListEl.innerHTML = "<p style='font-size: 0.8rem; text-align: center;'>No public repositories found.</p>";
                    latestContentEl.innerHTML = "<p style='font-size: 0.8rem; text-align: center;'>No repositories available.</p>";
                    return;
                }

                const getPagesUrl = (repoName) => `https://${username}.github.io/${repoName}/`;

                // Latest Project uses 'Capture d’écran 2026-08-20 à 18.06.56.png'
                const latestRepo = repos[0];
                latestContentEl.innerHTML = `
                    <a href="${getPagesUrl(latestRepo.name)}" target="_blank" class="project-card" style="background: #fff;">
                        <div class="project-left">
                            <img src="Capture d’écran 2026-08-20 à 18.06.56.png" alt="Latest" class="project-icon">
                            <div class="project-details">
                                <h3>${latestRepo.name}</h3>
                                <p>${latestRepo.description || "No description provided."}</p>
                            </div>
                        </div>
                        <span class="arrow-box">↗</span>
                    </a>
                `;

                // All Projects use 'IMG_1379.jpeg'
                repos.forEach(repo => {
                    const card = document.createElement('a');
                    card.href = getPagesUrl(repo.name);
                    card.target = "_blank";
                    card.className = "project-card";
                    
                    card.innerHTML = `
                        <div class="project-left">
                            <img src="IMG_1379.jpeg" alt="Project" class="project-icon">
                            <div class="project-details">
                                <h3>${repo.name}</h3>
                                <p>${repo.description || "Open source GitHub project"}</p>
                            </div>
                        </div>
                        <span class="arrow-box">↗</span>
                    `;
                    projectsListEl.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('projects-list').innerHTML = "<p style='font-size: 0.8rem; text-align: center; color: red;'>Could not load GitHub repositories.</p>";
            }
        }

        fetchGitHubData();
    </script>
</body>
</html>
