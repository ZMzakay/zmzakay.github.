<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zmzakay | Profile</title>
    <style>
        :root {
            --cardboard-bg: url('cardboard-texture.avif');
            --box-border: #5c3a21;
            --box-bg: #f4e8d1;
            --text-color: #2b1d0c;
            --accent-color: #8c5830;
        }

        body {
            margin: 0;
            padding: 20px 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Background configuration to cover entire screen and scale */
            background-image: var(--cardboard-bg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Box / Card Styling */
        .box {
            background-color: var(--box-bg);
            border: 2px solid var(--box-border);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Header stamp */
        .stamp-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px dashed var(--box-border);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            border: 2px solid var(--box-border);
            object-fit: cover;
        }

        .profile-info h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }

        .profile-info p {
            margin: 4px 0 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .watermark-stamp {
            border: 2px solid #b85d4f;
            color: #b85d4f;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 4px 8px;
            transform: rotate(4deg);
            text-transform: uppercase;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        /* Section Titles */
        .section-title {
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Links Grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .link-btn {
            background-color: #fff;
            border: 1.5px solid var(--box-border);
            padding: 10px 12px;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
        }

        .link-btn:hover {
            background-color: #eae0cc;
        }

        /* Project Cards */
        .project-card {
            background-color: #fff;
            border: 1.5px solid var(--box-border);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.1s;
        }

        .project-card:hover {
            background-color: #faf5ed;
        }

        .project-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .project-icon {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            border: 1px solid var(--box-border);
            object-fit: cover;
            flex-shrink: 0;
        }

        .project-details h3 {
            margin: 0;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .project-details p {
            margin: 3px 0 0;
            font-size: 0.8rem;
            opacity: 0.7;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .external-icon {
            font-size: 0.9rem;
            background: var(--box-border);
            color: #fff;
            padding: 4px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* Latest Project Highlight */
        .latest-box {
            background-color: #faeed4;
            border: 2px solid #b85d4f;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Top Box: Profile & Socials -->
        <div class="box">
            <div class="stamp-container">
                <div class="profile-header">
                    <img src="IMG_1379.jpeg" alt="Profile" class="avatar" id="profile-avatar">
                    <div class="profile-info">
                        <h1 id="profile-name">zmzakay</h1>
                        <p id="profile-handle">@zmzakay</p>
                    </div>
                </div>
                <div class="watermark-stamp">100% GitHub Made</div>
            </div>

            <!-- Social Links / Quick Links -->
            <div class="links-grid">
                <a href="https://github.com/zmzakay" target="_blank" class="link-btn">GitHub <span>↗</span></a>
                <a href="https://zmzakay.github.io" target="_blank" class="link-btn">Portfolio <span>↗</span></a>
            </div>
        </div>

        <!-- Latest Project Box -->
        <div class="box latest-box" id="latest-project-container">
            <div class="section-title">Latest Project <span>🔥</span></div>
            <div id="latest-project-content">
                <!-- Dynamically injected latest project -->
            </div>
        </div>

        <!-- All Projects Box (Fetched from GitHub) -->
        <div class="box">
            <div class="section-title">GitHub Projects <span id="repo-count">0</span></div>
            <div id="projects-list">
                <p style="font-size: 0.85rem; text-align: center; opacity: 0.7;">Loading repositories from GitHub...</p>
            </div>
        </div>

    </div>

    <script>
        const username = "zmzakay";
        
        // Fetch public repositories from GitHub API
        async function fetchGitHubData() {
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated`);
                if (!response.ok) throw new Error("Failed to fetch GitHub repositories");
                
                const repos = await response.json();
                
                // Update profile info counters/handles
                document.getElementById('profile-handle').textContent = `@${username}`;
                document.getElementById('repo-count').textContent = repos.length;

                const projectsListEl = document.getElementById('projects-list');
                const latestContentEl = document.getElementById('latest-project-content');
                
                projectsListEl.innerHTML = ""; // Clear loader

                if (repos.length === 0) {
                    projectsListEl.innerHTML = "<p style='font-size: 0.85rem; text-align: center;'>No public repositories found.</p>";
                    return;
                }

                // Helper to generate github pages url: https://zmzakay.github.io/(repo-name)/
                const getPagesUrl = (repoName) => `https://${username}.github.io/${repoName}/`;

                // 1. Latest Project (First element from sorted array) uses 'Capture d’écran 2026-08-20 à 18.06.56.png'
                const latestRepo = repos[0];
                latestContentEl.innerHTML = `
                    <a href="${getPagesUrl(latestRepo.name)}" target="_blank" class="project-card" style="margin-bottom: 0; background: #fff;">
                        <div class="project-left">
                            <img src="Capture d’écran 2026-08-20 à 18.06.56.png" alt="Latest" class="project-icon">
                            <div class="project-details">
                                <h3>${latestRepo.name}</h3>
                                <p>${latestRepo.description || "No description provided."}</p>
                            </div>
                        </div>
                        <div class="external-icon">↗</div>
                    </a>
                `;

                // 2. All Projects list use 'IMG_1379.jpeg' and link to github.io pages
                repos.forEach(repo => {
                    const card = document.createElement('a');
                    card.href = getPagesUrl(repo.name);
                    card.target = "_blank";
                    card.className = "project-card";
                    
                    card.innerHTML = `
                        <div class="project-left">
                            <img src="IMG_1379.jpeg" alt="Project" class="project-icon">
                            <div class="project-details">
                                <h3>${repo.name}</h3>
                                <p>${repo.description || "Open source GitHub project"}</p>
                            </div>
                        </div>
                        <div class="external-icon">↗</div>
                    `;
                    projectsListEl.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('projects-list').innerHTML = "<p style='font-size: 0.85rem; text-align: center; color: red;'>Could not load GitHub repositories.</p>";
            }
        }

        fetchGitHubData();
    </script>
</body>
</html>
